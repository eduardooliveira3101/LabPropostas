<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      href="assets/icon-tecnol-2.gif"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Solicite sua proposta</title>
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/Logo-tecnol-neutra.gif" alt="" />
      </header>

      <form id="proposalForm" action="">
        <fieldset id="client">
          <h1>Solicite sua proposta</h1>
          <div
            id="form-errors"
            class="form-errors"
            style="display: none"
            role="alert"
            aria-live="polite"
          ></div>

          <div class="input-wrapper">
            <label for="name">Nome</label>
            <input
              placeholder="Nome do solicitante"
              required
              type="text"
              id="name"
              name="name"
            />
          </div>

          <div class="input-wrapper">
            <label for="enterprise">Empresa</label>
            <input
              placeholder="Digite o nome de sua empresa"
              required
              type="text"
              id="enterprise"
              name="enterprise"
            />
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="initial">Previsão de início obra</label>
              <input required type="date" id="initial" name="initial" />
            </div>

            <div class="input-wrapper flex-1">
              <label for="finale">Previsão de término obra</label>
              <input required type="date" id="finale" name="finale" />
            </div>
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="tel">Celular</label>
              <input
                placeholder="ex: (85) 9 88888888"
                required
                type="tel"
                id="tel"
                name="tel"
              />
            </div>

            <div class="input-wrapper flex-1">
              <label for="email">Email</label>
              <input
                placeholder="Ex: joao@empresa.com"
                required
                type="email"
                id="email"
                name="email"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="service">
          <p>Tipo de serviço:</p>
          <div class="check-wrapper">
            <input type="checkbox" name="servico" value="PCE" id="PCE" />
            <label for="PCE">Prova de Carga Estática em Estaca (PCE)</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="desempenho"
              id="desempenho"
            />
            <label for="desempenho">Ensaios de Desempenho</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="geotecnia"
              id="geotecnia"
            />
            <label for="geotecnia">Estudos Geotécnicos</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="concreto-argamassa"
              id="concreto-argamassa"
            />
            <label for="concreto-argamassa"
              >Controle Tecnológico de Concreto e Argamassa</label
            >
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="controle-tech-solo"
              id="controle-tech-solo"
            />
            <label for="controle-tech-solo">Controle Tecnológico de Solo</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="controle-tech-astalto"
              id="controle-tech-asfalto"
            />
            <label for="controle-tech-asfalto"
              >Controle Tecnológico de Asfalto</label
            >
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="bloco-piso"
              id="bloco-piso"
            />
            <label for="bloco-piso">Bloco e Piso de Concreto</label>
          </div>

          <p>Explique sua necessidade:</p>
          <textarea name="esp_servico" id="esp_servico"></textarea>
        </fieldset>

        <fieldset id="state">
          <p>Onde o serviço será realizado:</p>
          <div class="radio-wrapper">
            <input type="radio" id="BA" name="state" value="bahia" />
            <label for="BA">Bahia</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="CE" name="state" value="ceara" checked />
            <label for="CE">Ceará</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="MA" name="state" value="maranhao" />
            <label for="MA">Maranhão</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="PI" name="state" value="piaui" />
            <label for="PI">Piaui</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="PE" name="state" value="pernambuco" />
            <label for="PE">Pernambuco</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="AL" name="state" value="alagoas" />
            <label for="AL">Alagoas</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="SE" name="state" value="sergipe" />
            <label for="SE">Sergipe</label>
          </div>

          <div class="radio-wrapper">
            <input type="radio" id="PB" name="state" value="paraiba" />
            <label for="PB">Paraiba</label>
          </div>

          <div class="radio-wrapper">
            <input
              type="radio"
              id="RN"
              name="state"
              value="rio-grande-do-norte"
            />
            <label for="RN">Rio Grande do Norte</label>
          </div>
          <div class="input-wrapper" id="city-container">
            <label for="city">Cidade</label>
            <select id="city" name="city" required>
              <option value="">Selecione uma cidade</option>
            </select>
            <button type="button" id="change-state-btn">Alterar estado</button>
          </div>
        </fieldset>

        <div class="input-wrapper">
          <input type="submit" value="Enviar" />
        </div>
      </form>
      <script src="script.js"></script>
    </div>
  </body>
</html>
