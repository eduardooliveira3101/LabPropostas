<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      href="assets/icon-tecnol-2.gif"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Solicite sua proposta</title>
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/Logo-tecnol-neutra.gif" alt="" />
      </header>

      <form action="">
        <fieldset>
          <legend>Solicite sua proposta</legend>

          <div class="input-wrapper m-b">
            <label for="enterprise">Empresa:</label>
            <input required type="text" id="enterprise" name="enterprise" />
          </div>

          <div class="input-wrapper">
            <label for="name">Nome:</label>
            <input required type="text" id="name" name="name" />
          </div>

          <div class="input-wrapper">
            <label for="tel">Telefone:</label>
            <input required type="tel" id="tel" name="tel" />
          </div>

          <div class="input-wrapper">
            <label for="email">Email:</label>
            <input required type="email" id="email" name="email" />
          </div>

          <div class="input-wrapper">
            <label for="initial">Início:</label>
            <input required type="date" id="initial" name="initial" />
          </div>
        </fieldset>

        <div class="input-wrapper">
          <input type="submit" value="Enviar" />
        </div>
      </form>
    </div>
  </body>
</html>
