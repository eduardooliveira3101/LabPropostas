<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      href="assets/icon-tecnol-2.gif"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Solicite sua proposta</title>
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/Logo-tecnol-neutra.gif" alt="" />
      </header>

      <form action="">
        <fieldset id="client">
          <legend>Solicite sua proposta</legend>

          <div class="wrapper">
            <div class="input-wrapper m-b flex-1">
              <label for="enterprise">Empresa</label>
              <input
                placeholder="Digite o nome de sua empresa"
                required
                type="text"
                id="enterprise"
                name="enterprise"
              />
            </div>
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="name">Nome</label>
              <input
                placeholder="Nome do solicitante"
                required
                type="text"
                id="name"
                name="name"
              />
            </div>

            <div class="input-wrapper flex-1">
              <label for="email">Email</label>
              <input
                placeholder="Ex: joao@empresa.com"
                required
                type="email"
                id="email"
                name="email"
              />
            </div>
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="initial">Data de inicio</label>
              <input required type="date" id="initial" name="initial" />
            </div>

            <div class="input-wrapper flex-1">
              <label for="tel">Celular</label>
              <input
                placeholder="ex: (85) 9 88888888"
                required
                type="tel"
                id="tel"
                name="tel"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="service">
          <p>Tipo de serviço</p>
          <div class="check-wrapper">
            <input type="checkbox" name="servico" value="PCE" id="PCE" />
            <label for="PCE">Prova de Carga Estática em Estaca (PCE)</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="desempenho"
              id="desempenho"
            />
            <label for="desempenho">Ensaios de Desempenho</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="geotecnia"
              id="geotecnia"
            />
            <label for="geotecnia">Estudos Geotécnicos</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="concreto-argamassa"
              id="concreto-argamassa"
            />
            <label for="concreto-argamassa"
              >Controle Tecnológico de Concreto e Argamassa</label
            >
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="controle-tech-solo"
              id="controle-tech-solo"
            />
            <label for="controle-tech-solo">Controle Tecnológico de Solo</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="controle-tech-astalto"
              id="controle-tech-asfalto"
            />
            <label for="controle-tech-asfalto"
              >Controle Tecnológico de Asfalto</label
            >
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico"
              value="bloco-piso"
              id="bloco-piso"
            />
            <label for="bloco-piso">Bloco e Piso de Concreto</label>
          </div>
        </fieldset>

        <div class="input-wrapper">
          <input type="submit" value="Enviar" />
        </div>
      </form>
    </div>
  </body>
</html>
