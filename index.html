<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      href="assets/icon-tecnol-2.gif"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Solicite sua proposta</title>
  </head>
  <body>
    <div class="container">
      <header>
        <img class="logo" src="./assets/Logo-tecnol-neutra.gif" alt="" />
      </header>

      <h1>Solicite sua proposta</h1>

      <form id="proposalForm" action="processar-form.php" method="POST">
        <fieldset id="client">
          <h2>Informações do cliente</h2>
          <div
            id="form-errors"
            class="form-errors"
            style="display: none"
            role="alert"
            aria-live="polite"
          ></div>

          <div class="input-wrapper">
            <label for="client_name">Nome do solicitante</label>
            <input
              placeholder="Digite o nome do solicitante"
              required
              type="text"
              id="client_name"
              name="client_name"
            />
          </div>

          <div class="input-wrapper flex-1">
            <label for="enterprise">Empresa solicitante</label>
            <input
              placeholder="Digite o nome de sua empresa"
              required
              maxlength="100"
              type="text"
              id="enterprise"
              name="enterprise"
            />
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="project_name">Nome do empreendimento</label>
              <input
                placeholder="Digite o nome do empreendimento"
                required
                type="text"
                id="project_name"
                name="project_name"
              />
            </div>
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="initial">Previsão de início da obra</label>
              <input
                placeholder="Data"
                required
                type="date"
                id="initial"
                name="initial"
              />
            </div>

            <div class="input-wrapper flex-1">
              <label for="finale">Previsão de término da obra</label>
              <input required type="date" id="finale" name="finale" />
            </div>
          </div>

          <div class="wrapper">
            <div class="input-wrapper flex-1">
              <label for="tel">Celular</label>
              <input
                placeholder="ex: 85988888888"
                required
                type="tel"
                id="tel"
                name="tel"
              />
            </div>

            <div class="input-wrapper flex-1">
              <label for="email">Email</label>
              <input
                placeholder="Ex: joao@empresa.com"
                required
                type="email"
                id="email"
                name="email"
              />
            </div>
          </div>
        </fieldset>

        <fieldset id="state">
          <h2>Localização</h2>

          <div class="input-wrapper address">
            <label for="address">Endereço da obra</label>
            <input
              placeholder="Digite o endereço completo do empreendimento"
              required
              type="text"
              id="address"
              name="address"
            />
          </div>
        </fieldset>

        <fieldset id="service">
          <h2>Ensaios</h2>
          <p>Quais são os tipos de serviço?</p>

          <div class="check-wrapper">
            <input type="checkbox" name="servico[]" value="PCE" id="PCE" />
            <label for="PCE">Prova de Carga Estática em Estaca (PCE)</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico[]"
              value="Ensaio de Desempenho"
              id="desempenho"
            />
            <label for="desempenho">Ensaios de Desempenho</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico[]"
              value="Estudos Geotecnicos"
              id="geotecnia"
            />
            <label for="geotecnia">Estudos Geotécnicos</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico[]"
              value="Controle Tecnologico de Concreto e Argamassa"
              id="concreto-argamassa"
            />
            <label for="concreto-argamassa"
              >Controle Tecnológico de Concreto e Argamassa</label
            >
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico[]"
              value="Controle Tecnologico de Solo"
              id="controle-tech-solo"
            />
            <label for="controle-tech-solo">Controle Tecnológico de Solo</label>
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico[]"
              value="Controle Tecnologico de Asfalto"
              id="controle-tech-asfalto"
            />
            <label for="controle-tech-asfalto"
              >Controle Tecnológico de Asfalto</label
            >
          </div>

          <div class="check-wrapper">
            <input
              type="checkbox"
              name="servico[]"
              value="Controle Tecnologico de Bloco e Piso de Concreto"
              id="bloco-piso"
            />
            <label for="bloco-piso"
              >Controle Tecnológico de Bloco e Piso de Concreto</label
            >
          </div>

          <p>Explique sua necessidade:</p>
          <textarea
            placeholder="Escreva quais são os ensaios que deseja"
            name="esp_servico"
            id="esp_servico"
          ></textarea>
        </fieldset>

        <div class="input-wrapper">
          <input type="submit" value="Enviar" />
        </div>
      </form>
      <script src="script.js"></script>
    </div>
  </body>
</html>
